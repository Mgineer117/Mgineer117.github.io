<script>
  /* Theme before first paint, so a dark visitor never gets a white flash.
     No stored value means "follow the system", which the CSS does on its own. */
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>

<!-- Custom Micro-animations -->
<style>
  /* Add subtle lift to cards on hover */
  .archive__item {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .archive__item:hover {
    transform: translateY(-2px);
  }
  /* Modernize button feel */
  .btn {
    transition: all 0.2s ease;
    border-radius: 6px;
  }
  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  }
  /* Smooth link colors */
  a {
    transition: color 0.15s ease-in-out;
  }
</style>

<!-- Custom design layer (must load after main.css) -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/site.css"/>
<script>
  /* Arm the scroll-reveal before first paint. If site.js never runs, the timeout
     disarms it so content can't be left invisible. */
  (function () {
    var d = document.documentElement;
    try {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    } catch (e) { return; }
    d.className += " reveal-on";
    window.setTimeout(function () {
      if (d.className.indexOf("reveal-ready") < 0) {
        d.className = d.className.replace(" reveal-on", "");
      }
    }, 2000);
  })();
</script>
<script src="{{ base_path }}/assets/js/site.js" defer></script>
